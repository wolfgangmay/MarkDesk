name: Release

on:
  # Manual trigger from the Actions tab (build + upload artifact; optionally cut a release)
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Also create a GitHub Release with this tag (e.g. v0.1.0)'
        required: false
  # Automatic release when you push a tag like v0.1.0
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build & publish single-file (Portable profile)
        run: dotnet publish src/MarkDesk -c Release -p:PublishProfile=Portable

      - name: Verify artifact
        shell: pwsh
        run: |
          $exe = "src/MarkDesk/bin/publish/portable/MarkDesk.exe"
          if (-not (Test-Path $exe)) { throw "Build artifact not found: $exe" }
          $sz = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "MarkDesk.exe built: $sz MB"

      - name: Pack single-file exe into ZIP
        shell: pwsh
        run: |
          $exe = "src/MarkDesk/bin/publish/portable/MarkDesk.exe"
          if (-not (Test-Path $exe)) { throw "Build artifact not found: $exe" }
          $tag = ($env:GITHUB_REF_NAME -replace '^v','')
          if (-not $tag) { $tag = "0.0.0" }
          $zip = "src/MarkDesk/bin/publish/portable/MarkDesk-$tag-win-x64.zip"
          Compress-Archive -Path $exe -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "SHA256 ($([System.IO.Path]::GetFileName($exe))) = $hash" |
            Set-Content "src/MarkDesk/bin/publish/portable/SHA256.txt"
          Write-Host "Packed: $zip"

      - name: Upload build artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: MarkDesk-portable
          path: |
            src/MarkDesk/bin/publish/portable/MarkDesk-*-win-x64.zip
            src/MarkDesk/bin/publish/portable/SHA256.txt
          if-no-files-found: error

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release != ''
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src/MarkDesk/bin/publish/portable/MarkDesk-*-win-x64.zip
            src/MarkDesk/bin/publish/portable/SHA256.txt
